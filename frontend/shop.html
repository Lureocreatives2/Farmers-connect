<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shop — Farmers Connect</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .controls {
      background: var(--white); border-bottom: 1px solid var(--border);
      padding: 1.1rem 0; position: sticky; top: var(--nav-h); z-index: 90;
      box-shadow: var(--shadow-sm);
    }
    .controls-top { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; margin-bottom: .85rem; }
    .controls-top .search-bar { flex: 1; min-width: 200px; }
    .results-count { font-size: .83rem; color: var(--muted); white-space: nowrap; font-weight: 500; }
    .state-select {
      border: 1.5px solid var(--border); border-radius: var(--r-pill);
      padding: .5rem 1rem; font-size: .83rem; color: var(--ink-2);
      background: var(--white); cursor: pointer; transition: border-color var(--t);
    }
    .state-select:focus { outline: none; border-color: var(--forest-400); }
    .filter-bar { display: flex; gap: .5rem; flex-wrap: wrap; }
    .tag { font-size: .78rem; }
  </style>
</head>
<body>
  <script src="js/api.js"></script>

  <div class="page-hero" style="padding:2.5rem 1.5rem 2rem">
    <div class="page-hero__inner">
      <div class="eyebrow">🛒 Marketplace</div>
      <h1>Shop Farm Produce</h1>
      <p>Fresh listings from verified Nigerian farmers</p>
    </div>
  </div>

  <div class="controls">
    <div class="container">
      <div class="controls-top">
        <div class="search-bar">
          <input type="text" id="searchInput" placeholder="Search tomatoes, yam, maize…" />
          <button onclick="applySearch()">🔍 Search</button>
        </div>
        <select class="state-select" id="stateFilter" onchange="load()">
          <option value="">All States</option>
          ${["Abia","Adamawa","Akwa Ibom","Anambra","Bauchi","Bayelsa","Benue","Borno","Cross River","Delta","Ebonyi","Edo","Ekiti","Enugu","FCT","Gombe","Imo","Jigawa","Kaduna","Kano","Katsina","Kebbi","Kogi","Kwara","Lagos","Nasarawa","Niger","Ogun","Ondo","Osun","Oyo","Plateau","Rivers","Sokoto","Taraba","Yobe","Zamfara"].map(s=>`<option>${s}</option>`).join("")}
        </select>
        <span class="results-count" id="resultCount">Loading…</span>
      </div>
      <div class="filter-bar">
        <div class="tag tag--forest active" data-cat="" onclick="selectCat(this)">All</div>
        <div class="tag tag--forest" data-cat="GRAINS"     onclick="selectCat(this)">🌾 Grains</div>
        <div class="tag tag--forest" data-cat="VEGETABLES" onclick="selectCat(this)">🥦 Vegetables</div>
        <div class="tag tag--forest" data-cat="FRUITS"     onclick="selectCat(this)">🍊 Fruits</div>
        <div class="tag tag--forest" data-cat="TUBERS"     onclick="selectCat(this)">🍠 Tubers</div>
        <div class="tag tag--forest" data-cat="LEGUMES"    onclick="selectCat(this)">🫘 Legumes</div>
        <div class="tag tag--forest" data-cat="LIVESTOCK"  onclick="selectCat(this)">🐄 Livestock</div>
        <div class="tag tag--forest" data-cat="DAIRY"      onclick="selectCat(this)">🥛 Dairy</div>
      </div>
    </div>
  </div>

  <main class="section">
    <div class="container">
      <div class="products-grid" id="grid"></div>
      <div class="pagination" id="pager"></div>
    </div>
  </main>

  <script>
    initLayout("shop");
    let page=1, cat="", search="", debounce;

    // Read URL param
    const urlCat = Utils.getParam("category");
    if (urlCat) { cat = urlCat; document.querySelectorAll(".tag").forEach(t=>t.classList.toggle("active", t.dataset.cat===cat)); }

    document.getElementById("searchInput").addEventListener("input", e => {
      clearTimeout(debounce);
      debounce = setTimeout(()=>{ search=e.target.value.trim(); page=1; load(); }, 380);
    });

    async function load() {
      const grid = document.getElementById("grid");
      grid.innerHTML = Utils.skels(8);
      try {
        const state = document.getElementById("stateFilter").value;
        const { data, pagination } = await ProductsAPI.getAll({ category:cat, search, state, page });
        document.getElementById("resultCount").textContent = `${pagination.total} product${pagination.total!==1?"s":""} found`;
        grid.innerHTML = data.length ? data.map(Utils.card).join("") :
          `<div class="empty" style="grid-column:1/-1"><div class="empty__icon">🌱</div><h3>No products found</h3><p>Try a different filter or search term.</p></div>`;
        renderPager(pagination);
      } catch(err) {
        grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="empty__icon">⚠️</div><h3>Couldn't load products</h3><p>${err.message}</p><button class="btn btn--primary btn--sm" style="margin-top:1rem" onclick="load()">Retry</button></div>`;
      }
    }

    function renderPager({totalPages,page:cur}) {
      const nav = document.getElementById("pager");
      if (totalPages<=1) { nav.innerHTML=""; return; }
      let h = `<button class="pag-btn" onclick="goPage(${cur-1})" ${cur===1?"disabled":""}>‹</button>`;
      for(let i=1;i<=totalPages;i++) h+=`<button class="pag-btn ${i===cur?"active":""}" onclick="goPage(${i})">${i}</button>`;
      h+=`<button class="pag-btn" onclick="goPage(${cur+1})" ${cur===totalPages?"disabled":""}>›</button>`;
      nav.innerHTML=h;
    }

    function goPage(p){ page=p; window.scrollTo({top:0,behavior:"smooth"}); load(); }
    function selectCat(el){ document.querySelectorAll(".tag").forEach(t=>t.classList.remove("active")); el.classList.add("active"); cat=el.dataset.cat; page=1; load(); }
    function applySearch(){ search=document.getElementById("searchInput").value.trim(); page=1; load(); }
    load();
  </script>
</body>
</html>
